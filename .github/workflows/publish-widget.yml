name: Publish widget

# Scheduled briefing runs push widget.json to the "widget-data" branch.
# This copies it onto main, where the KWGT widget reads it.
on:
  push:
    branches: [widget-data]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-widget
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Copy widget.json from widget-data to main
        run: |
          git fetch origin widget-data
          git checkout origin/widget-data -- widget.json
          if git diff --cached --quiet; then
            echo "widget.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish widget from widget-data"
          git push origin main
